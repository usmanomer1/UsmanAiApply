[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
# SPA redirect - must be last
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Ensure all JS and CSS assets are served with proper headers
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# Service worker
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Netlify handles gzip compression automatically - no need to set Content-Encoding headers manually